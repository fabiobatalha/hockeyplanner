{% extends "base.html" %}

{% block content %}
<section class="card sign-in-card" aria-labelledby="password-reset-title">
  <img class="sign-in-logo" src="{{ url_for('web_asset', filename='hockey-planner-logo.png') }}" alt="Hockey Planner" width="2172" height="724">
  <h1 id="password-reset-title">{{ gettext("Reset your password") }}</h1>
  <form method="post" data-token="{{ token }}" id="password-reset-form" class="auth-form">
    <div class="auth-field">
      <label for="reset-new-password">{{ gettext("New password") }}</label>
      <input id="reset-new-password" name="password" type="password" autocomplete="new-password" aria-describedby="reset-password-help" required>
      <p id="reset-password-help" class="auth-hint">{{ gettext("Use 12–128 characters, including at least one uppercase letter and one special character.") }}</p>
    </div>
    <button class="primary auth-submit" type="submit" disabled>{{ gettext("Reset password") }}</button>
  </form>
  <div class="auth-card-footer">
    <a class="button-link" href="{{ url_for('pages.index') }}">{{ gettext("Back to Hockey Planner") }}</a>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('web_asset', filename='auth.js') }}"></script>
{% endblock %}

  <dialog id="plan-viewer" aria-labelledby="plan-viewer-title">
    <div id="plan-presentation">
      <header class="plan-viewer-header">
        <h2 id="plan-viewer-title"></h2>
        <form method="dialog" class="actions">
          <button id="plan-viewer-fullscreen" type="button" hidden>Enter Fullscreen</button>
          <button type="submit">Exit Presentation</button>
        </form>
      </header>
      <div id="plan-viewer-activities" role="region" aria-label="Current drill" tabindex="0"></div>
      <nav class="plan-viewer-controls" aria-label="Drill navigation">
        <button id="plan-viewer-prev" type="button">← Previous</button>
        <span id="plan-viewer-position" role="status"></span>
        <button id="plan-viewer-next" type="button">Next →</button>
      </nav>
    </div>
  </dialog>

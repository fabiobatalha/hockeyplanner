  <dialog id="plan-viewer" aria-labelledby="plan-viewer-title">
    <div id="plan-presentation">
      <header class="plan-viewer-header">
        <h2 id="plan-viewer-title"></h2>
        <form method="dialog" class="actions">
          {% if print_drill %}<button id="print-viewer-drill" type="button">{{ gettext("Print Drill PDF") }}</button>{% endif %}
          <button id="plan-viewer-fullscreen" type="button" hidden>{{ gettext("Enter Fullscreen") }}</button>
          <button type="submit">{{ gettext("Exit Presentation") }}</button>
        </form>
      </header>
      {% if guest_free %}{% include "free_preview_notice.html" %}{% endif %}
      <div id="plan-viewer-activities" role="region" aria-label="{{ gettext('Current drill') }}" tabindex="0"></div>
      <nav class="plan-viewer-controls" aria-label="{{ gettext('Drill navigation') }}">
        <button id="plan-viewer-prev" type="button">{{ gettext("← Previous") }}</button>
        <span id="plan-viewer-position" role="status"></span>
        <button id="plan-viewer-next" type="button">{{ gettext("Next →") }}</button>
      </nav>
    </div>
  </dialog>

{% extends "base.html" %}

{% block content %}
<section class="card sign-in-card" aria-labelledby="auth-heading">
  <img class="sign-in-logo" src="{{ url_for('web_asset', filename='hockey-planner-logo.png') }}" alt="Hockey Planner" width="2172" height="724">
  <h1 id="auth-heading">Forgot your password?</h1>
  <p class="auth-intro">Enter the email address you use for Hockey Planner. We’ll send a link to reset your password.</p>
  <form method="post" id="forgot-password-form" class="auth-form">
    <div class="auth-field">
      <label for="reset-email">Email address</label>
      <input id="reset-email" name="email" type="email" autocomplete="email" maxlength="320" required>
    </div>
    <button class="primary auth-submit" type="submit" disabled>Send reset link</button>
  </form>
  <div class="auth-card-footer">
    <a class="button-link" href="{{ url_for('pages.login', next=next_path or None) }}">Back to sign in</a>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('web_asset', filename='auth.js') }}"></script>
{% endblock %}

[project]
name = "hockeyplanner"
version = "0.1.0"
description = "Hockey drill and practice planner"
readme = "README.md"
authors = [
    { name = "Fabio Batalha", email = "fabiobatalha@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "flask>=3.1,<4",
    "flask-babel>=4,<5",
    "gunicorn>=23,<28",
    "psycopg[binary]>=3.3,<4",
    "pydantic[email]>=2.12,<3",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
hockeyplanner = "hockeyplanner:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
